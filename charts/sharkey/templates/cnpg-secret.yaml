{{- if .Values.cnpg.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sharkey.cnpgClusterName" . }}-credentials
  labels:
    {{- include "sharkey.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.cnpg.owner | quote }}
  password: {{ .Values.cnpg.password | quote }}
{{- end }}
